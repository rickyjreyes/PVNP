name: PVNP Phase III-IV targeted Lean checks

on:
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/lean-phase3-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-iii-targeted:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.23.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get pinned Mathlib cache
        run: |
          lake exe cache get
      - name: Reject sorry, admit, or custom axioms in new modules
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
              PVNP/WCCDFiniteSupport.lean \
              PVNP/WCTLatticeGlobalBounds.lean \
              PVNP/WCTMeshScaling.lean \
              PVNP/WCTLatticeGlobal.lean \
              PVNP/WCCDFiniteSnapshot.lean \
              PVNP/WCCDFiniteWork.lean \
              PVNP/TMStackScan.lean \
              PVNP/ContinuumFluxBudget.lean \
              PVNP/WCTDependencyClosure.lean; then
            exit 1
          fi
      - name: Kernel check targeted Phase III-IV proof modules
        run: |
          lake build \
            PVNP.WCCDFiniteSupport \
            PVNP.WCTLatticeGlobalBounds \
            PVNP.WCTMeshScaling \
            PVNP.WCTLatticeGlobal \
            PVNP.WCCDFiniteSnapshot \
            PVNP.WCCDFiniteWork \
            PVNP.TMStackScan \
            PVNP.ContinuumFluxBudget \
            PVNP.WCTDependencyClosure
