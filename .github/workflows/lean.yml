name: PVNP Lean supporting theorems
on:
  push:
    branches: [main, formal/wcc-locality-resource-audit-10-11-20261027, astra/complete-program-20261102]
    paths: ['lean/**', '.github/workflows/lean.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.23.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: |
          for attempt in 1 2 3 4 5; do
            if lake update && lake exe cache get; then exit 0; fi
            echo "Mathlib/toolchain download failed (attempt $attempt/5), retrying"
            sleep 6
          done
          exit 1
      - name: Reject unfinished proof markers
        run: |
          if grep -rnE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' PVNP; then exit 1; fi
      - name: Kernel check (complete PVNP import tree)
        run: lake build PVNP
      - name: Check issue 10 and 11 proof modules explicitly
        run: lake build PVNP.LocalityLowerBound PVNP.ReplayCost PVNP.TMCellCompiler PVNP.RadiusCausality PVNP.TMGlobal PVNP.TMStayTrace PVNP.MachineCode PVNP.FiniteWCCCode PVNP.OracleObstruction PVNP.TMHeadMotion PVNP.TMHeadSupport PVNP.TMHeadUniqueRight PVNP.TMHeadUniqueLeft PVNP.TMHeadStep PVNP.TMMovingTrace
      - name: Check ASTRA completion modules explicitly (#10, #11, #12, #15)
        run: lake build PVNP.DiscreteMachines PVNP.TMtoWCC PVNP.WCCtoTM PVNP.ComplexityEquivalence PVNP.MachineSerialization PVNP.BandlimitedNoisyPacking PVNP.FourierReceiverProjection PVNP.DecisionVsEncodingCounterexample PVNP.PartIIIAnalytic PVNP.DiscreteCurvatureRail PVNP.PhysicalComplexityClasses PVNP.WitnessSizeUniformity PVNP.FourierTorusReceiver PVNP.PSubsetNP PVNP.CircleSpectralGap PVNP.WCTPlaneWave PVNP.TMScan PVNP.SATVerifier PVNP.PartIIIHighFreq3D PVNP.TransportCalculus PVNP.AnalogSplitSATCapacity PVNP.PhysicalModelAudit PVNP.WCCRadius PVNP.WCCGenerality PVNP.WCCDFiniteSupport PVNP.WCTLattice PVNP.WCTLatticeGlobalBounds PVNP.WCTMeshScaling PVNP.DecoderUniformity
      - name: Check D-1 single-tape TM compiler modules explicitly
        run: lake build PVNP.TMStackScan PVNP.SweepTM PVNP.WCCDCyclic PVNP.WCCDSweep PVNP.WCCDSweepSteps PVNP.WCCDSweepLoops PVNP.WCCDSweepRound PVNP.WCCDSweepBuild PVNP.WCCDSweepMain
      - name: Check manuscript Part I modules explicitly
        run: lake build PVNP.PartIPsiSat PVNP.PartISeparation PVNP.PartILocality PVNP.PartIDimLock
      - name: Check manuscript Part II/III modules explicitly
        run: lake build PVNP.PartIIManuscript PVNP.ManuscriptRemarks PVNP.PartIITuringModel PVNP.PartIITwoPhase PVNP.PartIIUniform
      - name: Check Milestone 5 uniform simulator and class equalities explicitly
        run: lake build PVNP.UniformSimLib PVNP.UniformSimProg PVNP.UniformSimSem PVNP.UniformSimMath PVNP.UniformSimPre PVNP.UniformSimGrow PVNP.UniformSimLoad PVNP.UniformSimInit PVNP.UniformSimPack PVNP.UniformSimRot PVNP.UniformSimApply PVNP.UniformSimRound PVNP.UniformSimMain PVNP.PartIIUniformEquiv
      - name: Check Phase VII/VIII crossing-sequence modules explicitly
        run: lake build PVNP.CrossingCapacity PVNP.CrossingTrace PVNP.CrossingSplice PVNP.CrossingDiagonal PVNP.CrossingHennie PVNP.CrossingSAT PVNP.CrossingSATSets
      - name: Check Phase IX target and no-go modules explicitly
        run: lake build PVNP.SATTarget PVNP.TseitinSAT PVNP.VerifierCrossing
      - name: Check CL-1 Cook–Levin modules explicitly
        run: lake build PVNP.CookLevinTableau PVNP.CookLevinKit PVNP.CookLevinHorner PVNP.CookLevinBits PVNP.CookLevinMain PVNP.CookLevinLabels PVNP.CookLevinGen PVNP.CookLevinDecide PVNP.CookLevinUniform
      - name: Check Part II conditional NP-safety modules explicitly
        run: lake build PVNP.FiniteModification PVNP.ConditionalNPSafety
      - name: Check unrestricted physical diagonal countermodel explicitly
        run: lake build PVNP.PhysicalDiagonal
      - name: Check consolidated Phase XI and toroidal modules explicitly
        run: lake build PVNP.PhaseXIQuadratic PVNP.ToroidalDiagonal
      - name: Check I-3 phase-locking scope test explicitly
        run: lake build PVNP.PhaseLockScope
      - name: Check Phase XIII logical-energy certification
        run: lake build PVNP.PhasePenaltyGap
      - name: Axiom audit of principal theorems (only propext, Classical.choice, Quot.sound allowed)
        run: |
          lake env lean audit/AxiomAudit.lean | tee axiom-audit.txt
          python3 audit/check_axioms.py audit/AxiomAudit.lean axiom-audit.txt
