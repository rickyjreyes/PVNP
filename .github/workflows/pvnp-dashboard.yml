name: PVNP formalization dashboard consistency

on:
  pull_request:
    paths:
      - 'pvnp/dashboard/**'
      - 'pvnp/proofs/manuscript-lean-inventory.md'
      - '.github/workflows/pvnp-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'pvnp/dashboard/**'
      - 'pvnp/proofs/manuscript-lean-inventory.md'
      - '.github/workflows/pvnp-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The original-statement view is read from the inventory's git history,
          # and the PR #49 entry is checked against that PR's head commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dashboard script syntax
        run: for f in pvnp/dashboard/*.js; do node --check "$f"; done
      - name: Require data.js to match a fresh build of the inventory, registry and Lean sources
        run: node pvnp/dashboard/build.js --check
      - name: Validate totals, per-claim statuses, provenance and declaration links
        run: node pvnp/dashboard/check.js
