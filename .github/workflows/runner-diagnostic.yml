name: PVNP runner allocation diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/runner-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-2204:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Confirm alternate runner starts
        run: |
          echo "runner_started=true"
          uname -a
