toolchain: "leanprover/lean4:v4.23.0"
scope: "finite/discrete algebraic core of revised PVNP papers"
kernel_verified_status: "requires successful GitHub Actions check for this revision"
modules:
  part_i:
    - PVNP/PartI.lean
    - PVNP/PartIExtended.lean
  part_ii:
    - PVNP/PartII.lean
    - PVNP/PartIIExtended.lean
  part_iii:
    - PVNP/PartIII.lean
    - PVNP/PartIIIExtended.lean
complete_claims_within_explicit_scope:
  - Boolean literal and CNF zero-penalty semantics
  - Conditional language separation implication
  - Deterministic finite-time transition replay
  - Radius-one symbolic machine local transition and commuting simulation
  - Explicit shifted denominator and quantization counterexamples
  - Symbolic zero-Laplacian distinguishability
  - Boolean hypercube normalized total influence upper bound
not_proved:
  - Full TM/WCC polynomial-time equivalence as machine complexity theorem
  - Physical PDE realization and curvature-preserving simulation
  - Universal exponential lower bound for locked-expander SAT
  - Physical P_WCC != NP_WCC
  - Classical P != NP
  - Continuum H2 counterexample or analytic capacity theorem

curvature_barrier_audit:
  module: PVNP/CurvatureBarrier.lean
  claim: "discrete curvature storage upper bounds for all bit strings and bounded-degree graphs"
  continuum_smooth_bump_proof: "paper proof only; not machine-checked"
  outstanding: "physical PDE invariant code and universal decision lower bound"

phase_sensitive_observability:
  module: PVNP/PhaseObservability.lean
  proved_in_lean: "algebraic consequences of detector/Poincare/Hölder bounds, global constant-mode and node-weight identities"
  analytic_only: "complex nonlinear PDE evolution, Fourier/Parseval, Sobolev and Poincare, detector derivative, dynamic invariants, nodal oscillation counterexample"
  no_claim: "universal information curvature cost or P versus NP separation"

fixed_mass_nodal_supplement:
  module: PVNP/FixedMassNodal.lean
  scope: independent_of_original_P_vs_NP_manuscript
  lean_proved: 'two-site fixed-mass density-weighted coercivity, scalar denominator bound, abstract transport transfer'
  analytic_only: '2D torus compactness coercivity on Hamiltonian sublevels, Hamiltonian conservation, nonlinear phase-observability inequality'
  missing: 'constructive uniform constants on input-growing domains and all-algorithm resource lower bounds'

expanding_domain_hamiltonian_test:
  module: PVNP/ExpandingDomain.lean
  proved_in_lean: "density weight volume bound; absence of volume-uniform floor; normalized mode algebra and bounded representative Hamiltonian expression"
  analytic_only: "exact complex plane-wave solution of projection-free PDE; Fourier readout and input-volume asymptotics"
  remains_open: "uniform WCC algorithm-independent resource lower bound and P versus NP"

split_sat_channel_capacity:
  module: PVNP/SplitSATCapacity.lean
  lean_scope: "indexed tripled-literal 3-CNF satisfiability iff set disjointness, exact deterministic rectangle-transcript all-protocol q^m capacity, binary slots"
  analytic_not_lean: "amplitude/noise scalar-symbol packing q <= ceil(A/eta) and hardware realization"
  not_proved: "model-independent physical communication or exponential classical SAT lower bound"

issue_11_discrete_uniform_simulation_audit:
  original_release: "https://doi.org/10.5281/zenodo.17732642 (Nov 26, 2025)"
  revised_source: "pvnp/papers/part-ii-discrete-wcc-turing-equivalence/main.tex (Oct 27, 2026)"
  actual_semantics: "PVNP.PartII.RadiusOneMachine: fixed blank, fixed synchronous triple-stencil rule, Fin n domain, no wrap"
  modules:
    - PVNP/TMCellCompiler.lean
    - PVNP/ReplayCost.lean
    - PVNP/PartII.lean
    - PVNP/PartIIExtended.lean
  proved_or_compiler_checked:
    - "arbitrary finite TM transition function compiled into a radius-one local rule, with exact center-head symbol/write/move local lemmas"
    - "uniform serialized synchronous sweep correctness, including length"
    - "explicit cubic upper bound for a declared indexed-list interpreter charge including input, witness, machine description, lattice and rounds"
  still_open:
    - "global exactly-one-head invariant and head position decoding for arbitrary transitions and boundary moves"
    - "uniform binary code for arbitrary Turing transition tables and exact executable TM interpreter"
    - "resource correspondence between unit-cost list charge and ordinary tape-TM steps (list access is charged, but compiler not proved)"
    - "true Turing-to-WCC total execution trace and both directions as explicit polynomial TM simulation"
    - "formal P and NP language-class equivalence across uniform machine families and witness polynomial lengths"
    - "physical curvature-preserving implementation of discrete WCC"

issue_10_model_relative_resource_lower_bound:
  original_release: "https://doi.org/10.5281/zenodo.17743607 (May 7, 2025; later revised)"
  revised_source: "pvnp/papers/part-i-curvature-bounded-wave-computation/main.tex (Oct 27, 2026)"
  module: "PVNP/LocalityLowerBound.lean"
  proved_unconditional_restricted:
    - "radius-one finite-lattice machines cannot distinguish two inputs differing at distance t+1 from fixed left-end readout in t rounds, for every local rule"
    - "same obstruction holds for any postprocessing that only receives the left-end state"
  explicit_scope:
    - "direct configuration encoding, no nonlocal preprocessing; fixed readout at leftmost cell"
    - "linear round lower bound for distal-bit access, not exponential curvature/SAT hardness"
  preexisting_counterexamples:
    - "PVNP/CurvatureBarrier.lean: O(n) local stored Boolean curvature"
    - "PVNP/ExpandingDomain.lean: density coefficient vanishes with increasing volume"
    - "PVNP/PhaseObservability.lean: uniform-phase and nodal obstructions"
    - "PVNP/PhysicalBounds.lean: many states can converge in one step"
  still_open:
    - "uniform input-size all-algorithm superpolynomial lower bound for any NP-complete language"
    - "charged uniform encodings and arbitrary phase-sensitive detectors"
    - "continuum curvature-to-computation bridge with all resource constants"
    - "classical P versus NP"

issue_10_radius_r_extension:
  module: PVNP/RadiusCausality.lean
  status: "radius-r core and two-stage prefix theorems Lean CI PASS at 9077a840; new general-size and two-stage decisional corollaries require current-head CI"
  model: "fixed finite radius-r synchronous full-stencil list rule; blank boundaries; direct embedding"
  new_targets:
    - "prefix_step: one global update loses at most radius r of matching prefix"
    - "prefix_iterate: t rounds propagate information no farther than t*r"
    - "prefix_decoder_equal: any decoder observing first m cells obeys cone theorem"
    - "no_prefix_decoder_last_bit: an all-input far-bit decider needs more than t rounds on length t*r+m+1"
    - "shortcut_encoding_reads_far_at_zero: nonlocal preprocessing invalidates uncharged readout lower bound"
  limitations:
    - "all-rule quantification within declared local stencil, not all physical architectures"
    - "radius, output locality and encoder cost must be explicitly charged as functions of input length"
    - "influence bound not a curvature bound or SAT hardness claim"

issue_11_global_tm_encoding_extension:
  module: PVNP/TMGlobal.lean
  status: "TMGlobal Lean CI PASS at 9077a840; bidirectional simulation remains open"
  targets:
    - "canonical one-head marked encoding from independent bounded-tape TM configuration"
    - "unique encoded head and exact global tape-write update for arbitrary finite transition"
    - "tape recovered from encoding equality"
  still_open:
    - "global head-move theorem and total valid execution traces with boundary policy"
    - "binary machine description and uniform compiler/decompiler complexity"
    - "actual single-tape TM interpreter program and machine-level time/space correctness"
    - "both directions polynomial time and NP witness class equivalence"

issue_11_finite_machine_description_and_restricted_trace:
  modules:
    - PVNP/MachineCode.lean
    - PVNP/FiniteWCCCode.lean
    - PVNP/TMStayTrace.lean
  status: "MachineCode, FiniteWCCCode, TMStayTrace Lean CI PASS at 9077a840; restricted scope only"
  genuine_theorem_scope:
    - "one-hot finite binary-grid machine table descriptions and injectivity"
    - "explicit polynomial table-bit bounds for finite Turing and finite WCC local rules"
    - "all-time exact encoding/step commutation for the stationary-head TM subclass only"
    - "single encoded head remains present throughout every stationary-head trace"
  nonclaims:
    - "no finite-stencil code table establishes the tape-TM interpreter's instruction count by itself"
    - "stationary-head trace is not a proof for arbitrary moving-head TMs"
    - "complete bidirectional polynomial TM/WCC equivalence and P/NP characterizations remain open"
  outstanding:
    - "global moving-head step and all-step invariant with boundary safety"
    - "flat binary serialization and parsing of machine code with running-time bounds"
    - "actual ordinary TM machine instruction schedule and proof of step count"
    - "uniform language and witness class inclusions with explicit size polynomials"

